services:
  # Backend Web Service (Node.js + Express + Socket.IO)
  - type: web
    name: smarthealthne-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://smarthealth-sentinel.onrender.com

  # Frontend Static Site (React + Vite + Tailwind + FontAwesome)
  - type: web
    name: smarthealth-sentinel
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://smarthealthne-backend.onrender.com

<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Report Symptoms</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#341100",
                        "outline-variant": "#c3c6d1",
                        "surface-container-high": "#dce9ff",
                        "tertiary-fixed-dim": "#ffb690",
                        "outline": "#737780",
                        "primary-container": "#003366",
                        "on-tertiary-container": "#d8885c",
                        "surface": "#f8f9ff",
                        "surface-container": "#e5eeff",
                        "on-background": "#0b1c30",
                        "secondary-fixed": "#6ffbbe",
                        "on-tertiary": "#ffffff",
                        "primary": "#001e40",
                        "error-container": "#ffdad6",
                        "on-error": "#ffffff",
                        "on-secondary-fixed-variant": "#005236",
                        "on-primary": "#ffffff",
                        "secondary": "#006c49",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-highest": "#d3e4fe",
                        "on-tertiary-fixed-variant": "#723610",
                        "secondary-container": "#6cf8bb",
                        "on-primary-fixed-variant": "#1f477b",
                        "background": "#f8f9ff",
                        "error": "#ba1a1a",
                        "surface-tint": "#3a5f94",
                        "secondary-fixed-dim": "#4edea3",
                        "surface-bright": "#f8f9ff",
                        "surface-variant": "#d3e4fe",
                        "inverse-surface": "#213145",
                        "inverse-on-surface": "#eaf1ff",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#a7c8ff",
                        "on-primary-fixed": "#001b3c",
                        "surface-container-low": "#eff4ff",
                        "primary-fixed": "#d5e3ff",
                        "on-surface-variant": "#43474f",
                        "on-secondary-container": "#00714d",
                        "on-primary-container": "#799dd6",
                        "on-error-container": "#93000a",
                        "on-surface": "#0b1c30",
                        "on-secondary-fixed": "#002113",
                        "surface-dim": "#cbdbf5",
                        "inverse-primary": "#a7c8ff",
                        "tertiary-container": "#592300",
                        "tertiary-fixed": "#ffdbca",
                        "tertiary": "#381300"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "unit": "8px",
                        "touch-target": "48px",
                        "stack-lg": "32px",
                        "stack-md": "16px",
                        "margin-mobile": "16px",
                        "margin-desktop": "32px",
                        "gutter": "16px",
                        "stack-sm": "8px"
                    },
                    "fontFamily": {
                        "table-header": ["Inter"],
                        "h1": ["Atkinson Hyperlegible Next"],
                        "caption": ["Inter"],
                        "body-md": ["Inter"],
                        "h3": ["Atkinson Hyperlegible Next"],
                        "body-lg": ["Inter"],
                        "button": ["Inter"],
                        "body-sm": ["Inter"],
                        "display": ["Atkinson Hyperlegible Next"],
                        "h2": ["Atkinson Hyperlegible Next"]
                    },
                    "fontSize": {
                        "table-header": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "h1": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "caption": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "h3": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "button": ["16px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "h2": ["24px", { "lineHeight": "32px", "fontWeight": "600" }]
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: #f8f9ff;
        }
        .symptom-card {
            transition: all 0.2s ease-in-out;
        }
        .symptom-card.selected {
            background-color: #003366;
            color: #ffffff;
            border-color: #003366;
        }
        .symptom-card.selected .material-symbols-outlined {
            color: #ffffff;
        }
    </style>
</head>
<body class="text-on-background bg-background font-body-md min-h-screen flex flex-col items-center pt-stack-lg pb-touch-target">
<header class="fixed top-0 w-full z-50 bg-primary shadow-sm flex justify-between items-center h-16 px-margin-desktop md:px-margin-desktop">
<div class="font-h2 text-h2 font-bold text-on-primary">SmartHealthNE 2.0</div>
<div class="flex gap-gutter items-center">
<span class="material-symbols-outlined text-on-primary cursor-pointer active:scale-95" data-icon="language">language</span>
<span class="material-symbols-outlined text-on-primary cursor-pointer active:scale-95" data-icon="signal_cellular_alt">signal_cellular_alt</span>
<span class="material-symbols-outlined text-on-primary cursor-pointer active:scale-95" data-icon="account_circle">account_circle</span>
</div>
</header>
<main class="w-full max-w-screen-md px-margin-mobile mt-24">
<div class="mb-stack-lg">
<div class="flex justify-between items-center mb-stack-sm">
<span class="font-body-sm text-body-sm text-on-surface-variant">Step 1 of 6</span>
<span class="font-body-sm text-body-sm font-bold text-primary">15%</span>
</div>
<div class="w-full bg-surface-container-high h-2 rounded-full overflow-hidden">
<div class="bg-primary h-full w-[15%] rounded-full"></div>
</div>
</div>
<h1 class="font-h1 text-h1 text-primary mb-stack-md text-center">What are you seeing?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant text-center mb-stack-lg">Select all symptoms that apply. This helps us track health trends in your community.</p>
<div class="grid grid-cols-2 md:grid-cols-3 gap-gutter mb-stack-lg">
<button class="symptom-card bg-surface flex flex-col items-center justify-center p-stack-md border border-outline-variant rounded-xl min-h-[140px] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<span class="material-symbols-outlined text-4xl text-primary mb-stack-sm" data-icon="water_drop">water_drop</span>
<span class="font-button text-button text-center">Diarrhea</span>
</button>
<button class="symptom-card bg-surface flex flex-col items-center justify-center p-stack-md border border-outline-variant rounded-xl min-h-[140px] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<span class="material-symbols-outlined text-4xl text-primary mb-stack-sm" data-icon="sick">sick</span>
<span class="font-button text-button text-center">Vomiting</span>
</button>
<button class="symptom-card bg-surface flex flex-col items-center justify-center p-stack-md border border-outline-variant rounded-xl min-h-[140px] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<span class="material-symbols-outlined text-4xl text-primary mb-stack-sm" data-icon="thermostat">thermostat</span>
<span class="font-button text-button text-center">Fever</span>
</button>
<button class="symptom-card bg-surface flex flex-col items-center justify-center p-stack-md border border-outline-variant rounded-xl min-h-[140px] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<span class="material-symbols-outlined text-4xl text-primary mb-stack-sm" data-icon="stomach">save_as</span>
<span class="font-button text-button text-center">Abdominal Pain</span>
</button>
<button class="symptom-card bg-surface flex flex-col items-center justify-center p-stack-md border border-outline-variant rounded-xl min-h-[140px] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<span class="material-symbols-outlined text-4xl text-primary mb-stack-sm" data-icon="dry">dry</span>
<span class="font-button text-button text-center">Dehydration</span>
</button>
<button class="symptom-card bg-surface flex flex-col items-center justify-center p-stack-md border border-outline-variant rounded-xl min-h-[140px] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<span class="material-symbols-outlined text-4xl text-primary mb-stack-sm" data-icon="add_circle">add_circle</span>
<span class="font-button text-button text-center">Other</span>
</button>
</div>
<div class="flex justify-between items-center mt-stack-lg">
<button class="font-button text-button text-primary border border-primary bg-transparent rounded-lg px-stack-lg py-3 min-h-[48px] hover:bg-surface-container-high transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
                Cancel
            </button>
<button class="font-button text-button text-on-primary bg-primary rounded-lg px-stack-lg py-3 min-h-[48px] hover:bg-primary/90 transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 flex items-center gap-2">
                Next Step
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</main>
<script>
        document.querySelectorAll('.symptom-card').forEach(card => {
            card.addEventListener('click', () => {
                card.classList.toggle('selected');
            });
        });
    </script>
</body></html>
